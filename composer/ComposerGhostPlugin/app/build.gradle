plugins {
  id 'com.android.application'
}

android {
  namespace 'ir.ghostide.composer'
  compileSdk 36

  defaultConfig {
    applicationId 'ir.ghostide.composer'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '1.0.0'
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

dependencies {
  compileOnly fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}