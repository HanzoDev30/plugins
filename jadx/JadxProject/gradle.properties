org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ErrorFile=/tmp/opencode/hs_err_%p.log -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.internal.instrumentation.agent=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# Same compileSdk as the Ghost IDE SDK sample (AGP 8.13.0 only warns about it)
android.suppressUnsupportedCompileSdk=36

# jadx library version (Maven Central: io.github.skylot:jadx-core).
# If a newer version fails to resolve, go back to 1.5.1 / 1.5.2.
jadxVersion=1.5.1
