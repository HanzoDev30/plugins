name: Build .gpl

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build plugin (.gpl)
        run: gradle :app:packageGpl --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: jadx-decompiler-gpl
          path: build/gpl/jadx-decompiler.gpl
