plugins {
  id 'com.android.application'
}

android {
  namespace 'com.javalsp.ghostide'
  compileSdk 36

  defaultConfig {
    applicationId 'com.javalsp.ghostide'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '1.0.0'
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
}

dependencies {
  compileOnly fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}