plugins {
  id 'com.android.application'
}

android {
  namespace 'ir.ghostide.composerlsp'
  compileSdk 36

  defaultConfig {
    applicationId 'ir.ghostide.composerlsp'
    minSdk 26
    targetSdk 36
    versionCode 2
    versionName '1.1.0'
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

dependencies {
  // The host app provides plugin-api, ide-api, ide-ui-api, the :editor module, sora-editor,
  // okhttp and gson at runtime, so every one of them stays compileOnly and is never shipped
  // inside the .gpl.
  compileOnly fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
  // Same sora-editor version the host uses, needed to touch CodeEditor/HighlightTextContainer.
  implementation 'io.github.rosemoe:editor:0.24.6'
  // Packagist lookups for the composer dependency checker.
  implementation 'com.squareup.okhttp3:okhttp:5.3.2'
  implementation 'com.google.code.gson:gson:2.14.0'
}
